<script type="module">

const cfg={apiKey:"AIzaSyA-Ru0oC1rnRpTU2MIM8FlZUm8k8C7BRGs",authDomain:"paramm-65bce.firebaseapp.com",projectId:"paramm-65bce",storageBucket:"paramm-65bce.firebasestorage.app",messagingSenderId:"368141466363",appId:"1:368141466363:web:b42d8cbad866ae207b8e5e"};

// Standard listeners
onSnapshot(doc(db,"appSettings","bankData"),d=>{window._bankData=d.exists()?d.data():{bankBalance:0,fds:[]};if(window._onDataUpdate)window._onDataUpdate();});

onSnapshot(collection(db,"customers"),snap=>{window._customers=snap.docs.map(d=>({id:d.id,...d.data()}));if(window._onDataUpdate)window._onDataUpdate();});
onSnapshot(collection(db,"vendors"),snap=>{window._vendors=snap.docs.map(d=>({id:d.id,...d.data()}));if(window._onDataUpdate)window._onDataUpdate();});
onSnapshot(collection(db,"staffLoans"),snap=>{window._staffLoans=snap.docs.map(d=>({id:d.id,...d.data()}));if(window._onDataUpdate)window._onDataUpdate();});
onSnapshot(collection(db,"reports"),snap=>{window._reports=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.savedAt||"").localeCompare(a.savedAt||""));if(window._onDataUpdate)window._onDataUpdate();});

// ── MAIN DAY LISTENER ──
// Simple rule: Firebase is the source of truth.
// On every update, merge arrays by ID (union) — never reduce.
onSnapshot(doc(db,"currentDay","today"),snap=>{
  if(!snap.exists()){window._latestDay=null;return;}
  const fresh=snap.data();
  window._latestDay=fresh;
  if(!appState.unlocked)return;
  if(fresh.date&&fresh.date!==appState.day.date){
    appState.day=_hydrateDay(fresh);
    render();return;
  }
  // Same date — add new records, apply edits, respect deletions
  let changed=false;

  // 1. Tombstones: union of local + remote deletions, so a delete never resurrects
  const tomb=new Set([...(appState.day.deletedSaleIds||[]),...(fresh.deletedSaleIds||[])]);
  appState.day.deletedSaleIds=[...tomb];
  const beforeLen=(appState.day.sales||[]).length;
  appState.day.sales=(appState.day.sales||[]).filter(s=>!tomb.has(s.id));
  if(appState.day.sales.length!==beforeLen) changed=true;

  // 2. Sales: add new ones, and replace any that were edited elsewhere
  const localById={};(appState.day.sales||[]).forEach(s=>{localById[s.id]=s;});
  (fresh.sales||[]).forEach(s=>{
    if(!s||!s.id||tomb.has(s.id)) return;
    const mine=localById[s.id];
    if(!mine){appState.day.sales.push(JSON.parse(JSON.stringify(s)));changed=true;return;}
    // Edited elsewhere and newer than my copy → take theirs
    if((s.updatedAt||"")>(mine.updatedAt||"")){
      Object.assign(mine,JSON.parse(JSON.stringify(s)));changed=true;
    }
  });

  const leIds=new Set((appState.day.expenses||[]).map(e=>e.id));
  (fresh.expenses||[]).forEach(e=>{if(e&&e.id&&!leIds.has(e.id)){appState.day.expenses.push(JSON.parse(JSON.stringify(e)));changed=true;}});
  const lpIds=new Set((appState.day.purchases||[]).map(p=>p.id));
  (fresh.purchases||[]).forEach(p=>{if(p&&p.id&&!lpIds.has(p.id)){appState.day.purchases.push(JSON.parse(JSON.stringify(p)));changed=true;}});
  const loIds=new Set((appState.day.otherIncome||[]).map(o=>o.id));
  (fresh.otherIncome||[]).forEach(o=>{if(o&&o.id&&!loIds.has(o.id)){(appState.day.otherIncome=appState.day.otherIncome||[]).push(JSON.parse(JSON.stringify(o)));changed=true;}});
  const llIds=new Set((appState.day.loans||[]).map(l=>l.id));
  (fresh.loans||[]).forEach(l=>{if(l&&l.id&&!llIds.has(l.id)){(appState.day.loans=appState.day.loans||[]).push(JSON.parse(JSON.stringify(l)));changed=true;}});

  // 3. finishedStock now syncs too — this was the bug that wiped sale deductions
  ['shift','incharge','notes','production','stock','preforms','shrinkStock','stickerStock','rmUsage','deposits','finishedStock','auditLog'].forEach(k=>{
    if(fresh[k]!==undefined)appState.day[k]=fresh[k];
  });
  if(window._onDataUpdate)window._onDataUpdate();
  if(changed){const act=document.activeElement;if(!act||act.tagName==="BODY"||act.tagName==="HTML")render();}
});

// Direct fetch of today's data — always loads sales regardless of date match
window._fbFetchToday=async function(){
  try{
    const snap=await getDoc(doc(db,"currentDay","today"));
    if(snap.exists()){
      const fresh=snap.data();
      window._latestDay=fresh;
      if(appState.unlocked){
        // Respect deletions first — union of local + remote tombstones
        const tomb2=new Set([...(appState.day.deletedSaleIds||[]),...(fresh.deletedSaleIds||[])]);
        appState.day.deletedSaleIds=[...tomb2];
        appState.day.sales=(appState.day.sales||[]).filter(s=>!tomb2.has(s.id));
        // Merge sales by id: add new, take newer edits, never resurrect deleted
        const byId={};(appState.day.sales||[]).forEach(s=>{byId[s.id]=s;});
        (fresh.sales||[]).forEach(s=>{
          if(!s||!s.id||tomb2.has(s.id)) return;
          const mine=byId[s.id];
          if(!mine){appState.day.sales.push(JSON.parse(JSON.stringify(s)));return;}
          if((s.updatedAt||"")>(mine.updatedAt||"")) Object.assign(mine,JSON.parse(JSON.stringify(s)));
        });
        // Always merge expenses and purchases
        const existingExpIds=new Set((appState.day.expenses||[]).map(e=>e.id));
        (fresh.expenses||[]).forEach(e=>{if(e&&e.id&&!existingExpIds.has(e.id))appState.day.expenses.push(JSON.parse(JSON.stringify(e)));});
        const existingPurIds=new Set((appState.day.purchases||[]).map(p=>p.id));
        (fresh.purchases||[]).forEach(p=>{if(p&&p.id&&!existingPurIds.has(p.id))appState.day.purchases.push(JSON.parse(JSON.stringify(p)));});
        // Always merge deposits (bank deposits) by id
        const existingDepIds=new Set((appState.day.deposits||[]).map(x=>x.id));
        (fresh.deposits||[]).forEach(x=>{if(x&&x.id&&!existingDepIds.has(x.id)){if(!appState.day.deposits)appState.day.deposits=[];appState.day.deposits.push(JSON.parse(JSON.stringify(x)));}});
        // Other income + staff loan movements
        if(!appState.day.otherIncome)appState.day.otherIncome=[];
        const existingIncIds=new Set(appState.day.otherIncome.map(x=>x.id));
        (fresh.otherIncome||[]).forEach(x=>{if(x&&x.id&&!existingIncIds.has(x.id))appState.day.otherIncome.push(JSON.parse(JSON.stringify(x)));});
        if(!appState.day.loans)appState.day.loans=[];
        const existingLoanIds=new Set(appState.day.loans.map(x=>x.id));
        (fresh.loans||[]).forEach(x=>{if(x&&x.id&&!existingLoanIds.has(x.id))appState.day.loans.push(JSON.parse(JSON.stringify(x)));});
        ['shift','incharge','notes','production','stock','preforms','shrinkStock','stickerStock','rmUsage','finishedStock','auditLog'].forEach(k=>{
          if(fresh[k]!==undefined)appState.day[k]=fresh[k];
        });
        render();
      }
    }
  }catch(e){console.error("_fbFetchToday error:",e);}
};

</script>

<script>
// ── GLOBALS ──
window._staffCodes=[];
window._customers=[];
window._vendors=[];
window._reports=[];
window._ownerPin="";
window._viewerPin="";
window._pinLoaded=false;
window._fbReady=false;
window._dayEdited=false;

const SIZES=["200ml","300ml","500ml","750ml","1000ml"];
const BPC={"200ml":48,"300ml":36,"500ml":24,"750ml":12,"1000ml":12};
const PFG={"200ml":9,"300ml":10.4,"500ml":12.5,"750ml":32,"1000ml":20.5};
const MATS=[
  {id:"caps_white",label:"Caps White",unit:"box(8000)"},
  {id:"caps_blue",label:"Caps Blue",unit:"box(8000)"},
  {id:"ph",label:"pH Booster",unit:"ml"},
  {id:"anti",label:"Antiscalant",unit:"ml"},
  {id:"minerals",label:"Minerals",unit:"ml"},
];
// Shrink rolls tracked per roll (varying weight) like stickers
const SHRINKS=[
  {id:"shrink_500",label:"Shrink Roll 500mm"},
  {id:"shrink_540",label:"Shrink Roll 540mm"},
  {id:"shrink_550",label:"Shrink Roll 550mm"},
];
// Stickers tracked separately with rolls + numbers
const STICKERS=[
  {id:"stk_200",label:"Sticker 200ml"},
  {id:"stk_300",label:"Sticker 300ml"},
  {id:"stk_500",label:"Sticker 500ml"},
  {id:"stk_750",label:"Sticker 750ml"},
  {id:"stk_1000",label:"Sticker 1000ml"},
];
const BIZ={name:"Vipassana Ventures LLP",addr:"SSIT Campus, Marlur, Tumkur, Bangalore Rural-572105",gstin:"29AAZFV5378B1ZD",pan:"AAZFV5378B",state:"Karnataka",contact:"+91-90263 76086",bank:"ICICI Bank",acc:"171005001329",ifsc:"ICIC0001710",branch:"Dr. M C Modi Hospital Branch"};

// Broad supply categories for vendors — a vendor picks one or more of these,
// and Purchases then only shows the specific items within categories that
// vendor supplies.
const SUPPLY_CATS=[
  {id:"preforms",label:"🔵 Preforms",items:()=>SIZES.map(s=>({id:"pf_"+s+"_bags",label:"Preforms "+s}))},
  {id:"caps",label:"🧢 Caps",items:()=>MATS.filter(m=>m.id.startsWith("caps_")).map(m=>({id:m.id,label:m.label}))},
  {id:"chemicals",label:"🧪 Minerals & Chemicals",items:()=>MATS.filter(m=>!m.id.startsWith("caps_")).map(m=>({id:m.id,label:m.label}))},
  {id:"shrink",label:"🌀 Shrink Roll",items:()=>SHRINKS.map(s=>({id:s.id,label:s.label}))},
  {id:"sticker",label:"🏷 Sticker",items:()=>STICKERS.map(s=>({id:s.id,label:s.label}))},
];

const num=v=>parseFloat(v)||0;
const fmt=n=>Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=n=>Number(n||0).toLocaleString("en-IN");
const today=()=>new Date().toISOString().split("T")[0];
const uid=()=>Date.now()+Math.random().toString(36).slice(2,8);

// ── APP STATE ──
let appState={
  unlocked:false,
  role:"",
  currentUser:null,
  tab:"day",
  day:newDay(),
  viewPhoto:null,
  showInv:null,
};

function newDay(){
  const pf={};
  SIZES.forEach(s=>{pf[s]={bags:"",kgPerBag:"25",used:""};});
  const stkStock={};
  STICKERS.forEach(s=>{stkStock[s.id]={rolls:[],total:0};});
  const shrinkStock={};
  SHRINKS.forEach(s=>{shrinkStock[s.id]={rolls:[],total:0};});
  return {id:uid(),date:today(),incharge:"",shift:"Morning",preforms:pf,
    stock:Object.fromEntries(MATS.map(m=>[m.id,""])),
    stickerStock:stkStock,
    shrinkStock:shrinkStock,
    finishedStock:Object.fromEntries(SIZES.map(s=>[s,0])),
    rmUsage:[],purchases:[],production:Object.fromEntries(SIZES.map(s=>[s,""])),
    sales:[],expenses:[],deposits:[],notes:"",
    otherIncome:[],          // scrap sales & any non-bottle income
    loans:[],                // staff loan cash movements for the day
    deletedSaleIds:[],       // tombstones — stops deleted sales resurrecting
    auditLog:[]};            // who edited/deleted what, and when
}

// ── SHARED MONEY HELPERS (single source of truth for every screen) ──
// Bottle sales only
function dayBottleSales(d){return (d?.sales||[]).reduce((s,x)=>s+num(x.total),0);}
// Scrap / other income — merged into Revenue per owner's setting
function dayOtherIncome(d){return (d?.otherIncome||[]).reduce((s,x)=>s+num(x.amount),0);}
// TOTAL REVENUE = bottle sales + other income
function dayRevenue(d){return dayBottleSales(d)+dayOtherIncome(d);}
function dayExpenses(d){return (d?.expenses||[]).reduce((s,x)=>s+num(x.amount),0);}
function dayProfit(d){return dayRevenue(d)-dayExpenses(d);}
// Cash actually received today
function dayCashIn(d){
  const fromSales=(d?.sales||[]).reduce((s,x)=>s+num(x.cashAmt||0),0);
  const fromOther=(d?.otherIncome||[]).filter(x=>x.mode!=="Bank").reduce((s,x)=>s+num(x.amount),0);
  const fromLoanRepay=(d?.loans||[]).filter(l=>l.type==="repay").reduce((s,l)=>s+num(l.amount),0);
  return fromSales+fromOther+fromLoanRepay;
}
// Online / bank received today
function dayOnlineIn(d){
  const fromSales=(d?.sales||[]).reduce((s,x)=>s+num(x.onlineAmt||0),0);
  const fromOther=(d?.otherIncome||[]).filter(x=>x.mode==="Bank").reduce((s,x)=>s+num(x.amount),0);
  return fromSales+fromOther;
}
// Cash that physically left the drawer today
function dayCashOut(d){
  const exp=(d?.expenses||[]).filter(e=>e.mode!=="Bank").reduce((s,e)=>s+num(e.amount),0);
  const pur=(d?.purchases||[]).filter(p=>p.paid==="Paid"&&p.mode==="Cash").reduce((s,p)=>s+num(p.totalWithGST||p.total||0),0);
  const loansOut=(d?.loans||[]).filter(l=>l.type==="issue").reduce((s,l)=>s+num(l.amount),0);
  return exp+pur+loansOut;
}
function dayDeposits(d){return (d?.deposits||[]).reduce((s,x)=>s+num(x.amount),0);}
// TRUE cash in hand
function dayCashInHand(d){return dayCashIn(d)-dayCashOut(d)-dayDeposits(d);}
// Total credit given today (full credit AND partial credit)
function dayCreditGiven(d){
  return (d?.sales||[]).reduce((s,x)=>s+(num(x.creditAmt)>0?num(x.creditAmt):(x.payMode==="Credit"?num(x.total):0)),0);
}
// Cases sold across ALL product lines of every sale (multi-size safe)
function daySoldCases(d,size){
  return (d?.sales||[]).reduce((s,sale)=>{
    const items=sale.items||[{size:sale.size,cases:sale.cases}];
    return s+items.filter(it=>!size||it.size===size).reduce((t,it)=>t+num(it.cases),0);
  },0);
}
function logAudit(action,detail){
  const d=appState.day;
  if(!d.auditLog) d.auditLog=[];
  d.auditLog.push({id:uid(),action,detail,by:appState.currentUser?.name||appState.role||"owner",at:new Date().toISOString()});
}

// Returns true if a day object contains ANY meaningful entered data (not just sales)
function dayHasData(d){
  if(!d) return false;
  if((d.sales||[]).length>0) return true;
  if((d.expenses||[]).length>0) return true;
  if((d.purchases||[]).length>0) return true;
  if((d.deposits||[]).length>0) return true;
  if((d.rmUsage||[]).length>0) return true;
  if((d.otherIncome||[]).length>0) return true;
  if((d.loans||[]).length>0) return true;
  if(d.production&&SIZES.some(s=>num(d.production[s])>0)) return true;
  if(d.finishedStock&&SIZES.some(s=>num(d.finishedStock[s])>0)) return true;
  if(d.stock&&Object.values(d.stock).some(v=>num(v)>0)) return true;
  if((d.notes||"").trim()!=="") return true;
  return false;
}

async function fbSet(col,id,data){try{const{doc,setDoc}=window._fs;await setDoc(doc(window._db,col,id),data);}catch(e){console.error('fbSet error:',e);}}
async function fbUpd(col,id,data){try{const{doc,updateDoc}=window._fs;await updateDoc(doc(window._db,col,id),data);}catch(e){console.error('fbUpd error:',e);}}
async function fbDel(col,id){try{const{doc,deleteDoc}=window._fs;await deleteDoc(doc(window._db,col,id));}catch(e){console.error('fbDel error:',e);}}

// ── SYNC ENGINE ──
window._saveQueue=Promise.resolve();

async function syncDay(){
  window._saveQueue=window._saveQueue.then(async()=>{
    try{
      // GUARD: never overwrite a populated Firebase day with a blank local day.
      // If local has no data but Firebase does, skip the write.
      if(!dayHasData(appState.day) && dayHasData(window._latestDay) &&
         (window._latestDay.date===appState.day.date)){
        console.warn("syncDay skipped: local day empty but Firebase has data");
        return;
      }
      await fbSet("currentDay","today",JSON.parse(JSON.stringify(appState.day)));
    }catch(e){console.error("syncDay error:",e);}
  });
  await window._saveQueue;
}

      <input type="tel" id="pinBox" maxlength="10" placeholder="Enter PIN / Code"

        onkeydown="if(event.key==='Enter')doLogin()" />
      <button onclick="doLogin()" style="background:#00bfff;color:#fff;border:none;border-radius:8px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;width:100%;">

// Shared restore: always fetch the freshest today doc directly, then decide.
// Restores if Firebase has ANY data for today (not just sales), and never
// lets a stale/empty local state clobber it.
// Deep-copy every array field so nothing shares a reference with the snapshot
function _hydrateDay(latest){
  const d=Object.assign(newDay(),latest);
  ['sales','expenses','purchases','deposits','rmUsage','otherIncome','loans','deletedSaleIds','auditLog'].forEach(k=>{
    d[k]=JSON.parse(JSON.stringify(latest[k]||[]));
  });
  d.finishedStock=JSON.parse(JSON.stringify(latest.finishedStock||{}));
  return d;
}

async function restoreDayOnLogin(landingTab){
  let latest=null;
  try{
    const{doc,getDoc}=window._fs;
    const snap=await getDoc(doc(window._db,"currentDay","today"));
    if(snap.exists()) latest=snap.data();
  }catch(e){ latest=window._latestDay||null; }
  window._latestDay=latest;

  const isNewDay=latest&&latest.date&&latest.date!==today();
  const isPastCutoff=new Date().getHours()>=6;

  if(latest&&dayHasData(latest)&&isNewDay&&isPastCutoff){
    appState.day=_hydrateDay(latest);
    appState.tab=landingTab;render();
    setTimeout(async()=>{await autoClosePreviousDay(appState.day,latest.date);},500);
  } else if(latest&&dayHasData(latest)){
    // Same working day (or before cutoff) — restore everything as-is
    appState.day=_hydrateDay(latest);
    appState.tab=landingTab;render();
  } else {
    appState.day=loadPrevStock(newDay());
    appState.tab=landingTab;render();
  }
}

window.doLogin = function(){
  const box=document.getElementById("pinBox");
  const err=document.getElementById("loginErr");
  if(!box){render();return;}
  const val=box.value.trim();
  if(!val){if(err)err.textContent="Please enter your PIN";return;}
  if(!window._pinLoaded){
    if(err) err.textContent="⏳ Still connecting to server... please wait 5 seconds and try again";
    return;
  }

  const owner=String(window._ownerPin||"").trim();
  const viewer=String(window._viewerPin||"").trim();

  // First time — set owner PIN
  if(!owner){
    if(!confirm("Set '"+val+"' as your OWNER PIN?\n\nThis gives full access. Keep it SECRET!")) return;
    window._ownerPin=val;
    fbSet("appSettings","pins",{ownerPin:val,viewerPin:""});
    appState.unlocked=true; appState.role="owner"; appState.tab="day";
    render(); return;
  }

  if(val===owner){
    appState.unlocked=true;appState.role="owner";
    appState.currentUser={name:window._ownerName||"Owner",role:"owner"};
    restoreDayOnLogin("day");
    return;
  }

  if(viewer&&val===viewer){
    appState.unlocked=true;appState.role="viewer";
    appState.currentUser={name:"Viewer",role:"viewer"};
    appState.tab="rpts";render();return;
  }

  const sc=(window._staffCodes||[]).find(c=>String(c.code).trim()===val&&c.active);
  if(sc){
    appState.unlocked=true;appState.role=sc.role||"entry";
    appState.currentUser={name:sc.name,role:sc.role||"entry"};
    restoreDayOnLogin(sc.role==="viewer"?"rpts":"day");
    return;
  }

  // Wrong
  if(err) err.innerHTML=`<span style="color:#ff4d4d;">❌ Wrong PIN or code</span>`;
  box.value=""; box.focus();
};

function buildMaterialStockLocked(){
  const d=appState.day;
  const rows=[];
  function liveAvail(matId){
    const used=d.rmUsage.filter(r=>r.material===matId).reduce((s,r)=>s+num(r.qty),0);
    const purchased=d.purchases.filter(p=>p.material===matId).reduce((s,p)=>s+num(p.qty),0);
    if(matId.startsWith("pf_")&&matId.endsWith("_bags")){
      const size=matId.replace("pf_","").replace("_bags","");
      const pf=d.preforms?.[size]||{};
      const batches=pf.batches||[{bags:pf.bags||0,kgPerBag:pf.kgPerBag||25}];
      const opening=batches.reduce((s,b)=>s+num(b.bags),0);
      return {opening,purchased,used,avail:Math.max(0,opening+purchased-used)};
    }
    const shrink=SHRINKS.find(s=>s.id===matId);
    if(shrink){const sv=d.shrinkStock?.[matId]||{};const opening=(sv.rolls||[]).reduce((s,r)=>s+num(r),0);return {opening,purchased,used,avail:Math.max(0,opening+purchased-used)};}
    const cap=MATS.find(m=>m.id===matId);
    if(cap) return {opening:num(d.stock[matId]),purchased,used,avail:Math.max(0,num(d.stock[matId])+purchased-used)};
    const stk=STICKERS.find(m=>m.id===matId);
    if(stk){const sv=d.stickerStock?.[matId]||{};const opening=(sv.rolls||[]).reduce((s,r)=>s+num(r),0)||num(sv.total);return {opening,purchased,used,avail:Math.max(0,opening+purchased-used)};}
    return {opening:0,purchased:0,used:0,avail:0};

  // ── LIVE STOCK SUMMARY (auto from usage + purchases) ──
  function liveAvail(matId){
    const used=d.rmUsage.filter(r=>r.material===matId).reduce((s,r)=>s+num(r.qty),0);
    // Also add purchases of this material
    const purchased=d.purchases.filter(p=>p.material===matId).reduce((s,p)=>s+num(p.qty),0);
    if(matId.startsWith("pf_")&&matId.endsWith("_bags")){
      const size=matId.replace("pf_","").replace("_bags","");
      const pf=d.preforms?.[size]||{};
      const batches=pf.batches||[{bags:pf.bags||0,kgPerBag:pf.kgPerBag||25}];
      const opening=batches.reduce((s,b)=>s+num(b.bags),0);
      return Math.max(0,opening+purchased-used);
    }
    const shrink=SHRINKS.find(s=>s.id===matId);
    if(shrink){const sv=d.shrinkStock?.[matId]||{};const opening=(sv.rolls||[]).reduce((s,r)=>s+num(r),0);return Math.max(0,opening+purchased-used);}
    const cap=MATS.find(m=>m.id===matId);
    if(cap) return Math.max(0,num(d.stock[matId])+purchased-used);
    const stk=STICKERS.find(m=>m.id===matId);
    if(stk){const sv=d.stickerStock?.[matId]||{};const opening=(sv.rolls||[]).reduce((s,r)=>s+num(r),0)||num(sv.total);return Math.max(0,opening+purchased-used);}
    return 0;
  }

  return `
  <div class="card">
    <div class="lbl">📦 Opening Stock</div>
    <p style="color:#5a8aaa;font-size:12px;margin:0 0 12px;">Enter once at start of day. Stock auto-updates from usage &amp; purchases.</p>

      ${SIZES.map(size=>{
        const pf=d.preforms?.[size]||{batches:[{bags:'',kgPerBag:'25'}]};

        const usedPcs=usedKg>0?Math.floor(usedKg*1000/PFG[size]):0;
        const availKg=Math.max(0,totalKg-usedKg);
        const availPcs=Math.max(0,totalPcs-usedPcs);

window.saveStock=async function(){
  if(window._materialStockSet){alert("Opening stock already set.");return;}
  if(!confirm("This can only be done ONCE. After saving, materials stock becomes read-only and will only change automatically from Purchases and Usage Log. Continue?")) return;
  syncDay();
  window._materialStockSet=true;
  window._stockConfigDoc={...(window._stockConfigDoc||{}),materialStockSet:true,materialStockSetAt:new Date().toISOString()};
  try{ await fbSet("appSettings","stockConfig",window._stockConfigDoc); }
  catch(e){ console.error("saveStock lock error:",e); }
  render();
  alert("✅ Opening stock set. Materials stock will now update automatically only.");
}

window.addShrinkRoll=function(id){
  if(!appState.day.shrinkStock) appState.day.shrinkStock={};
  if(!appState.day.shrinkStock[id]) appState.day.shrinkStock[id]={rolls:[],total:0};
  appState.day.shrinkStock[id].rolls.push("");
  syncDay();render();
};
window.upShrinkRoll=function(id,idx,val){
  if(!appState.day.shrinkStock) appState.day.shrinkStock={};
  if(!appState.day.shrinkStock[id]) appState.day.shrinkStock[id]={rolls:[],total:0};
  appState.day.shrinkStock[id].rolls[idx]=val;
  appState.day.shrinkStock[id].total=appState.day.shrinkStock[id].rolls.reduce((s,r)=>s+num(r),0);
  syncDay();render();
};
window.delShrinkRoll=function(id,idx){
  if(!appState.day.shrinkStock?.[id]) return;
  appState.day.shrinkStock[id].rolls.splice(idx,1);
  appState.day.shrinkStock[id].total=appState.day.shrinkStock[id].rolls.reduce((s,r)=>s+num(r),0);
  syncDay();render();
};

window.upPF=function(size,key,val){
  if(!appState.day.preforms[size]) appState.day.preforms[size]={batches:[{bags:'',kgPerBag:'25'}]};
  appState.day.preforms[size][key]=val;
  syncDay(); render();
};

window.addPFBatch=function(size){
  if(!appState.day.preforms[size]) appState.day.preforms[size]={batches:[{bags:'',kgPerBag:'25'}]};
  const pf=appState.day.preforms[size];
  if(!pf.batches) pf.batches=[{bags:pf.bags||'',kgPerBag:pf.kgPerBag||'25'}];
  pf.batches.push({bags:'',kgPerBag:'25'});
  syncDay(); render();
};

window.upPFBatch=function(size,idx,key,val){
  if(!appState.day.preforms[size]) appState.day.preforms[size]={batches:[{bags:'',kgPerBag:'25'}]};
  const pf=appState.day.preforms[size];
  if(!pf.batches) pf.batches=[{bags:pf.bags||'',kgPerBag:pf.kgPerBag||'25'}];
  pf.batches[idx][key]=val;
  syncDay(); render();
};

window.delPFBatch=function(size,idx){
  if(!appState.day.preforms[size]?.batches) return;
  appState.day.preforms[size].batches.splice(idx,1);
  if(appState.day.preforms[size].batches.length===0)
    appState.day.preforms[size].batches=[{bags:'',kgPerBag:'25'}];
  syncDay(); render();
};

function buildStockSummary(){
  const d=appState.day;
  const rows=[];

  // Preforms
  SIZES.forEach(size=>{
    const pf=d.preforms?.[size]||{bags:'',kgPerBag:'25'};
    const kg=num(pf.bags)*num(pf.kgPerBag||25);
    const opening=kg>0?Math.floor(kg*1000/PFG[size]):0;
    if(opening===0) return;
    const usedBags=d.rmUsage.filter(r=>r.material==='pf_'+size+'_bags').reduce((s,r)=>s+num(r.qty),0);
    const usedNos=d.rmUsage.filter(r=>r.material==='pf_'+size).reduce((s,r)=>s+num(r.qty),0);
    const usedFromBags=usedBags>0?Math.floor(usedBags*num(pf.kgPerBag||25)*1000/PFG[size]):0;
    const totalUsed=usedNos+usedFromBags;
    const avail=Math.max(0,opening-totalUsed);
    rows.push(`<tr style="border-bottom:1px solid #1a3a5522;">
      <td style="padding:6px 8px;color:#e0f0ff;">${size} Preforms</td>
      <td style="padding:6px 8px;text-align:right;">${fmtN(opening)}</td>
      <td style="padding:6px 8px;text-align:right;color:#ff4d4d;">${fmtN(totalUsed)}</td>
      <td style="padding:6px 8px;text-align:right;font-weight:700;color:${avail<100?'#ff4d4d':'#00e676'};">${fmtN(avail)}</td>
    </tr>`);
  });

  // Caps, Shrink, Minerals
  MATS.forEach(mat=>{
    const opening=num(d.stock[mat.id]);
    if(opening===0) return;
    const used=d.rmUsage.filter(r=>r.material===mat.id).reduce((s,r)=>s+num(r.qty),0);
    const avail=Math.max(0,opening-used);
    rows.push(`<tr style="border-bottom:1px solid #1a3a5522;">
      <td style="padding:6px 8px;color:#e0f0ff;">${mat.label}</td>
      <td style="padding:6px 8px;text-align:right;">${fmtN(opening)} ${mat.unit}</td>
      <td style="padding:6px 8px;text-align:right;color:#ff4d4d;">${fmtN(used)}</td>
      <td style="padding:6px 8px;text-align:right;font-weight:700;color:${avail<=0?'#ff4d4d':'#00e676'};">${fmtN(avail)} ${mat.unit}</td>
    </tr>`);
  });

  // Stickers
  STICKERS.forEach(stk=>{
    const sv=d.stickerStock?.[stk.id]||{total:0};
    const opening=num(sv.total);
    if(opening===0) return;
    const used=d.rmUsage.filter(r=>r.material===stk.id).reduce((s,r)=>s+num(r.qty),0);
    const avail=Math.max(0,opening-used);
    rows.push(`<tr style="border-bottom:1px solid #1a3a5522;">
      <td style="padding:6px 8px;color:#e0f0ff;">${stk.label}</td>
      <td style="padding:6px 8px;text-align:right;">${fmtN(opening)}</td>
      <td style="padding:6px 8px;text-align:right;color:#ff4d4d;">${fmtN(used)}</td>
      <td style="padding:6px 8px;text-align:right;font-weight:700;color:${avail<=0?'#ff4d4d':'#00e676'};">${fmtN(avail)}</td>
    </tr>`);
  });

  if(rows.length===0){
    return `<div class="card"><div class="lbl">📊 Stock Available</div>
      <div style="color:#5a8aaa;text-align:center;padding:16px;font-size:13px;">Enter opening stock first in the 📦 Stock tab</div>
    </div>`;
  }

  return `<div class="card">
    <div class="lbl">📊 Stock Available Now</div>
    <p style="color:#5a8aaa;font-size:12px;margin:0 0 8px;">Updates live as usage is logged. Red = low/zero stock.</p>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr style="background:#1a3a55;">
          <th style="padding:6px 8px;text-align:left;color:#00bfff;">Item</th>
          <th style="padding:6px 8px;text-align:right;color:#00bfff;">Opening</th>
          <th style="padding:6px 8px;text-align:right;color:#ff4d4d;">Used</th>
          <th style="padding:6px 8px;text-align:right;color:#00e676;">Available</th>
        </tr>
        ${rows.join('')}
      </table>
    </div>
  </div>`;
}

window.addRM=function(){
  const matId=document.getElementById("rmMat")?.value;
  const qty=document.getElementById("rmQty")?.value;
  const note=document.getElementById("rmNote")?.value||"";
  if(!matId||!qty){alert("Select material and enter qty");return;}
  const d=appState.day;
  let label,unit,extra="";
  const SHRINK_LIST=[{id:"shrink_500",label:"Shrink Roll 500mm"},{id:"shrink_540",label:"Shrink Roll 540mm"},{id:"shrink_550",label:"Shrink Roll 550mm"}];

  // ── STOCK AVAILABILITY CHECK ──
  function getAvailable(mat){
    const alreadyUsed=d.rmUsage.filter(r=>r.material===mat).reduce((s,r)=>s+num(r.qty),0);
    if(mat.endsWith("_bags")){
      const size=mat.replace("pf_","").replace("_bags","");
      const pf=d.preforms?.[size]||{};
      const batches=pf.batches||[{bags:pf.bags||0,kgPerBag:pf.kgPerBag||25}];
      const openingBags=batches.reduce((s,b)=>s+num(b.bags),0);
      return openingBags-alreadyUsed;
    }
    const shrink=SHRINK_LIST.find(s=>s.id===mat);
    if(shrink){
      const sv=d.shrinkStock?.[mat]||{};
      const opening=(sv.rolls||[]).reduce((s,r)=>s+num(r),0)||num(sv.total)||0;
      return opening-alreadyUsed;
    }
    const capChem=MATS.find(m=>m.id===mat);
    if(capChem) return num(d.stock[mat])-alreadyUsed;
    const stk=STICKERS.find(m=>m.id===mat);
    if(stk){ const sv=d.stickerStock?.[mat]||{}; const opening=num(sv.total)||((sv.rolls||[]).reduce((s,r)=>s+num(r),0)); return opening-alreadyUsed; }
    return Infinity;
  }

  if(matId.endsWith("_bags")){
    const size=matId.replace("pf_","").replace("_bags","");
    const kgPerBag=num(document.getElementById("rmKgBag")?.value||25);
    const kg=num(qty)*kgPerBag;
    const cnt=Math.floor(kg*1000/PFG[size]);
    // Check bags available
    const avail=getAvailable(matId);
    if(num(qty)>avail){
      alert(`⚠️ Not enough bags!\nAvailable: ${avail} bags\nEntered: ${qty} bags`);return;
    }
    label=size+" Preforms"; unit="bags";
    extra="≈"+fmtN(cnt)+" preforms ("+qty+" bags × "+kgPerBag+"kg = "+kg.toFixed(1)+"kg)";
    appState.day.rmUsage.push({id:uid(),material:matId,label,unit,qty,note,extra,kgPerBag});
    render(); syncDay(); return;
  } else if(SHRINK_LIST.find(s=>s.id===matId)){
    const sh=SHRINK_LIST.find(s=>s.id===matId);
    const avail=getAvailable(matId);
    if(avail<=0||num(qty)>avail){
      alert(`⚠️ Not enough ${sh.label}!\nAvailable: ${avail.toFixed(1)} kg\nEntered: ${qty} kg`);return;
    }
    label=sh.label; unit="kg";
  } else {
    const mat=MATS.find(m=>m.id===matId)||STICKERS.find(m=>m.id===matId);
    if(!mat){alert("Select a valid material");return;}
    const avail=getAvailable(matId);
    const unit2=STICKERS.find(m=>m.id===matId)?"nos":mat.unit||"";
    if(num(d.stock[matId]||0)>0&&num(qty)>avail){
      alert(`⚠️ Not enough ${mat.label}!\nAvailable: ${avail} ${unit2}\nEntered: ${qty} ${unit2}`);return;
    }
    label=mat.label;
    unit=unit2;
  }
  appState.day.rmUsage.push({id:uid(),material:matId,label,unit,qty,note,extra});
  render(); syncDay();
};

window.delRM=function(id){if(appState.role!=="owner"){alert("Only owner can delete");return;}appState.day.rmUsage=appState.day.rmUsage.filter(r=>r.id!==id);render();syncDay();};

function buildPurMatOptions(vendorName){
  const v=vendorName?(window._vendors||[]).find(x=>x.name===vendorName):null;
  const vCats=v?(v.materials||[]):[];
  const showAll=!v||vCats.length===0;
  const showCat=cid=>showAll||vCats.includes(cid);
  let groups="";
  if(showCat("preforms")) groups+=`<optgroup label="🔵 Preforms">${SIZES.map(s=>`<option value="pf_${s}_bags">Preforms ${s}</option>`).join("")}</optgroup>`;
  if(showCat("caps")) groups+=`<optgroup label="🧢 Caps">${MATS.filter(m=>m.id.startsWith("caps_")).map(m=>`<option value="${m.id}">${m.label}</option>`).join("")}</optgroup>`;
  if(showCat("chemicals")) groups+=`<optgroup label="🧪 Minerals & Chemicals">${MATS.filter(m=>!m.id.startsWith("caps_")).map(m=>`<option value="${m.id}">${m.label}</option>`).join("")}</optgroup>`;
  if(showCat("shrink")) groups+=`<optgroup label="🌀 Shrink Rolls">${SHRINKS.map(s=>`<option value="${s.id}">${s.label}</option>`).join("")}</optgroup>`;
  if(showCat("sticker")) groups+=`<optgroup label="🏷 Stickers">${STICKERS.map(s=>`<option value="${s.id}">${s.label}</option>`).join("")}</optgroup>`;
  return `<select class="sel" id="purMat" onchange="onPurMatChange()">
    <option value="">— Select —</option>
    ${groups}
  </select>`;
}

window.calcPur=function(){
  const matId=document.getElementById("purMat")?.value;
  const q=num(document.getElementById("purQty")?.value);
  const r=num(document.getElementById("purRate")?.value);
  const isPF=matId&&matId.startsWith("pf_");
  const isCaps=matId==="caps_white"||matId==="caps_blue";
  const kgBag=num(document.getElementById("purPfBagKg")?.value||25);
  const CAPS_PER_BOX=8000;
  // base calculation
  let base=0;
  if(isPF) base=q*kgBag*r;
  else if(isCaps) base=q*CAPS_PER_BOX*r; // boxes × 8000 caps × rate per cap
  else base=q*r;
  const el=document.getElementById("purTotal");
  if(el) el.value=base>0?base.toFixed(2):"";
  const calc=document.getElementById("purCalc");
  if(calc&&base>0){
    calc.innerHTML=`<div style="background:#1a3a55;border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;">
      ${isCaps?`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#5a8aaa;">${q} boxes × 8,000 caps/box</span><span style="color:#00bfff;font-weight:700;">= ${fmtN(q*CAPS_PER_BOX)} caps</span></div>
      <div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#5a8aaa;">Rate per cap</span><span>₹${r}</span></div>`:""}
      ${isPF?`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#5a8aaa;">${q} bags × ${kgBag}kg</span><span>= ${(q*kgBag).toFixed(1)} kg</span></div>`:""}
      <div style="display:flex;justify-content:space-between;padding:2px 0;border-top:1px solid #2a4a65;margin-top:4px;padding-top:4px;"><span style="color:#5a8aaa;">Base Total</span><span>₹${fmt(base)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#5a8aaa;">GST 18%</span><span style="color:#ffc107;">+₹${fmt(base*0.18)}</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:800;border-top:1px solid #2a4a65;padding-top:6px;margin-top:6px;"><span>Grand Total</span><span style="color:#ff4d4d;">₹${fmt(base*1.18)}</span></div>
    </div>`;
  } else if(calc) calc.innerHTML="";
  // Preform preview
  const preview=document.getElementById("purPfPreview");
  if(preview&&isPF&&q>0&&r>0){
    const gram=num(document.getElementById("purPfGram")?.value||12.5);
    const totalKg=q*kgBag;
    const pcs=Math.floor(totalKg*1000/gram);
    preview.innerHTML=`<div style="background:#00e5cc15;border:1px solid #00e5cc33;border-radius:8px;padding:8px;font-size:12px;color:#00e5cc;margin-bottom:8px;">
      📦 ${q} bags × ${kgBag}kg = <strong>${totalKg.toFixed(1)} kg</strong> ≈ <strong>${fmtN(pcs)} preforms</strong> (${gram}g each)<br/>
      💰 ${totalKg.toFixed(1)}kg × ₹${r}/kg = <strong>₹${fmt(base)}</strong>
    </div>`;
  } else if(preview) preview.innerHTML="";
};

window.addPur=function(){
  const vend=document.getElementById("purVend")?.value?.trim();
  const matId=document.getElementById("purMat")?.value;
  const qty=num(document.getElementById("purQty")?.value);
  const rate=num(document.getElementById("purRate")?.value);
  const paid=document.getElementById("purPaid")?.value||"Paid";
  const mode=document.getElementById("purMode")?.value||"Cash";
  const note=document.getElementById("purNote")?.value||"";
  if(!vend||!qty||!rate){alert("Enter vendor, quantity and rate");return;}
  // Caps validation — catch if user entered individual caps instead of boxes
  const isCapsCheck=matId==="caps_white"||matId==="caps_blue";
  if(isCapsCheck&&qty>500){
    if(!confirm(`⚠️ You entered ${qty} — did you mean ${qty} BOXES (= ${fmtN(qty*8000)} caps)?\n\nTap OK to confirm ${qty} boxes, or Cancel to re-enter.`)) return;
  }
  const isPF=matId&&matId.startsWith("pf_");
  const isCaps=matId==="caps_white"||matId==="caps_blue";
  const kgBag=num(document.getElementById("purPfBagKg")?.value||25);
  const gram=num(document.getElementById("purPfGram")?.value||12.5);
  const CAPS_PER_BOX=8000;
  // Base calculation
  let base=0;
  if(isPF) base=qty*kgBag*rate;
  else if(isCaps) base=qty*CAPS_PER_BOX*rate;
  else base=qty*rate;
  const gstAmt=base*0.18;
  let label=matId,unit="",pfPreview="",stockUpdate=null;
  if(isPF){
    const size=matId.replace("pf_","").replace("_bags","");
    const totalKg=qty*kgBag;
    const pcs=Math.floor(totalKg*1000/gram);
    label=`Preforms ${size}`;unit="bags";
    pfPreview=`${qty} bags × ${kgBag}kg @ ₹${rate}/kg = ${totalKg.toFixed(1)}kg ≈ ${fmtN(pcs)} pcs`;
    const d=appState.day;
    if(!d.preforms) d.preforms={};
    if(!d.preforms[size]) d.preforms[size]={batches:[]};
    if(!d.preforms[size].batches) d.preforms[size].batches=[{bags:d.preforms[size].bags||0,kgPerBag:kgBag}];
    d.preforms[size].batches.push({bags:qty,kgPerBag:kgBag});
    stockUpdate=`✅ Preform ${size} stock updated: +${qty} bags (${totalKg.toFixed(1)}kg ≈ ${fmtN(pcs)} pcs)`;
  } else if(isCaps){
    const mat=MATS.find(m=>m.id===matId);
    label=mat?.label||matId;unit="boxes";
    pfPreview=`${qty} boxes × 8,000 caps @ ₹${rate}/cap = ${fmtN(qty*CAPS_PER_BOX)} caps`;
    appState.day.stock[matId]=(num(appState.day.stock[matId])||0)+qty;
    stockUpdate=`✅ ${label} stock updated: +${qty} boxes`;
  } else {
    const mat=MATS.find(m=>m.id===matId)||SHRINKS.find(m=>m.id===matId)||STICKERS.find(m=>m.id===matId);
    label=mat?.label||matId;
    unit=mat?.unit||"";
    if(matId&&MATS.find(m=>m.id===matId)){
      appState.day.stock[matId]=(num(appState.day.stock[matId])||0)+qty;
      stockUpdate=`✅ ${label} stock updated: +${qty}`;
    }
  }
  const entry={id:uid(),vendor:vend,material:matId,label,qty,unit,rate,rateUnit:isPF?"per kg":"per unit",kgBag:isPF?kgBag:null,totalKg:isPF?qty*kgBag:null,total:base,gstAmt,totalWithGST:base+gstAmt,paid,mode,note,pfPreview,date:appState.day.date};
  appState.day.purchases.push(entry);
  if(paid==="Unpaid"||paid==="Part Paid"){
    const v=(window._vendors||[]).find(v=>v.name===vend);
    if(v) fbUpd("vendors",v.id,{outstanding:num(v.outstanding)+base+gstAmt});
  }
  if(paid==="Paid"&&mode==="Bank") adjustBankBalance(-(base+gstAmt));
  // Save through the single serialized queue (prevents races)
  syncDay();
  render();
  if(stockUpdate) setTimeout(()=>alert(stockUpdate),300);
};

// Commits the draft into finished stock, logs it into d.production for the
// day's record, then resets the draft (and displayed fields) to zero.
window.saveProdToStock=function(){
  const d=appState.day;
  if(!d.finishedStock) d.finishedStock=Object.fromEntries(SIZES.map(s=>[s,0]));
  const draft=window._prodDraft||{};
  let movedAny=false;
  SIZES.forEach(size=>{
    const qty=num(draft[size]);
    if(qty>0){
      d.finishedStock[size]=Math.max(0,num(d.finishedStock[size])+qty);
      d.production[size]=num(d.production[size])+qty; // running record for the day
      movedAny=true;
    }
  });
  if(!movedAny){alert("Enter at least one case count first");return;}
  window._prodDraft={}; // reset entry fields to zero
  syncDay();render();
  alert("✅ Moved to Available Stock. Production entry reset.");
};

// One-time opening stock setup. After this runs once, the setup card never
// appears again — stock becomes fully automatic (production adds, sales
// subtract), with no further manual override.
window.setOpeningStockOnce=async function(){
  if(window._openingStockSet){alert("Opening stock has already been set.");return;}
  if(!confirm("This can only be done ONCE. After saving, you will not be able to manually edit stock again — it will update automatically from production and sales. Continue?")) return;
  const d=appState.day;
  if(!d.finishedStock) d.finishedStock=Object.fromEntries(SIZES.map(s=>[s,0]));
  SIZES.forEach(size=>{
    const v=document.getElementById("openStk_"+size)?.value;
    d.finishedStock[size]=Math.max(0,num(v));
  });
  window._openingStockSet=true;
  window._stockConfigDoc={...(window._stockConfigDoc||{}),openingStockSet:true,setAt:new Date().toISOString()};
  try{ await fbSet("appSettings","stockConfig",window._stockConfigDoc); }
  catch(e){ console.error("setOpeningStockOnce save error:",e); }
  syncDay();render();
  alert("✅ Opening stock set. Stock will now update automatically only.");
};

window.calcCreditSplit=function(type){
  const draft=window._saleDraft||{items:[]};
  const draftTotal=draft.items.reduce((s,it)=>s+(num(it.cases)*num(it.price)),0);
  const paid=type==="Cash"?num(document.getElementById("saleCash")?.value):num(document.getElementById("saleOnline")?.value);
  const credit=Math.max(0,draftTotal-paid);
  const msg=document.getElementById("splitMsg");
  if(msg&&draftTotal>0){
    msg.innerHTML=`💵 Paid: ₹${fmt(paid)} &nbsp;|&nbsp; 📋 Credit: ₹${fmt(credit)}`;
    msg.style.color=credit>0?"#ffc107":"#00e676";
  }
};

window.calc3WaySplit=function(){
  const draft=window._saleDraft||{items:[]};
  const draftTotal=draft.items.reduce((s,it)=>s+(num(it.cases)*num(it.price)),0);
  const cash=num(document.getElementById("saleCash")?.value);
  const online=num(document.getElementById("saleOnline")?.value);
  const credit=Math.max(0,draftTotal-cash-online);

// ── SALE EFFECT ENGINE ──
// Every figure a sale touches lives in exactly these two functions, so an edit
// is simply: reverse the old version, apply the new one. Nothing can drift.
function _saleCredit(sale){
  return num(sale.creditAmt)>0?num(sale.creditAmt):(sale.payMode==="Credit"?num(sale.total):0);
}
function _reverseSaleEffects(sale){
  if(!sale) return;
  const d=appState.day;
  if(!d.finishedStock) d.finishedStock=Object.fromEntries(SIZES.map(s=>[s,0]));
  // 1. Put the stock back
  (sale.items||[{size:sale.size,cases:sale.cases}]).forEach(it=>{
    d.finishedStock[it.size]=num(d.finishedStock[it.size])+num(it.cases);
  });
  // 2. Take the online money back out of the bank
  if(num(sale.onlineAmt)>0) adjustBankBalance(-num(sale.onlineAmt));
  // 3. Remove the credit from the customer's outstanding
  const cr=_saleCredit(sale);
  if(cr>0){
    const c=(window._customers||[]).find(c=>c.name===sale.customer);
    if(c) fbUpd("customers",c.id,{balance:Math.max(0,num(c.balance)-cr)});
  }
}
function _applySaleEffects(sale){
  if(!sale) return;
  const d=appState.day;
  if(!d.finishedStock) d.finishedStock=Object.fromEntries(SIZES.map(s=>[s,0]));
  (sale.items||[]).forEach(it=>{
    d.finishedStock[it.size]=Math.max(0,num(d.finishedStock[it.size])-num(it.cases));
  });
  if(num(sale.onlineAmt)>0) adjustBankBalance(num(sale.onlineAmt));
  const cr=_saleCredit(sale);
  if(cr>0){
    const c=(window._customers||[]).find(c=>c.name===sale.customer);
    if(c) fbUpd("customers",c.id,{balance:num(c.balance)+cr});
  }
}

window.addSale=function(){
  const cust=document.getElementById("saleCust")?.value?.trim();
  const pay=document.getElementById("salePay")?.value||"Cash";
  const note=document.getElementById("saleNote")?.value||"";
  const draft=window._saleDraft||{items:[{size:"200ml",cases:"",price:""}]};
  if(!cust){alert("Select a customer");return;}

  // ── EDIT MODE: reverse the old sale first so stock/bank/credit are clean ──
  const editId=draft.editId||null;
  let oldSale=null;
  if(editId){
    if(appState.role!=="owner"){alert("Only the owner can edit a sale.");return;}
    oldSale=(appState.day.sales||[]).find(s=>s.id===editId);
    if(oldSale) _reverseSaleEffects(oldSale);
  }
  // If validation below fails we must undo the reversal — this puts it back.
  const bailOut=(msg)=>{ if(oldSale) _applySaleEffects(oldSale); alert(msg); render(); };

  // Validate all items have cases and price
  for(let i=0;i<draft.items.length;i++){
    const it=draft.items[i];
    if(!it.cases||!it.price){bailOut("Fill cases and price for Item "+(i+1));return;}
    if(num(it.cases)<=0||num(it.price)<=0){bailOut("Cases and price must be greater than 0 for Item "+(i+1));return;}
  }

  // HARD BLOCK: cannot sell more than available stock (aggregated per size,
  // since one sale can have multiple lines of the same size).
  {
    const d0=appState.day;
    if(!d0.finishedStock) d0.finishedStock=Object.fromEntries(SIZES.map(s=>[s,0]));
    const neededBySize={};
    draft.items.forEach(it=>{ neededBySize[it.size]=(neededBySize[it.size]||0)+num(it.cases); });
    for(const size in neededBySize){
      const avail=num(d0.finishedStock[size]||0);
      const needed=neededBySize[size];
      if(needed>avail){
        bailOut("❌ Not enough stock for "+size+"!\nAvailable: "+fmtN(avail)+" cases\nTrying to sell: "+fmtN(needed)+" cases\n\nReduce the quantity or add production first.");
        return;
      }
    }
  }

  // Build items array from draft
  const items=draft.items.map(it=>({
    size:it.size,
    cases:num(it.cases),
    pricePerCase:num(it.price),
    total:num(it.cases)*num(it.price),
    bottles:num(it.cases)*(BPC[it.size]||24)
  }));
  const total=items.reduce((s,it)=>s+it.total,0);

  let cashAmt=0,onlineAmt=0,creditAmt=0;
  if(pay==="Cash") cashAmt=total;
  else if(pay==="Online") onlineAmt=total;
  else if(pay==="Credit") creditAmt=total;
  else if(pay==="Both"){
    cashAmt=num(document.getElementById("saleCash")?.value);
    onlineAmt=num(document.getElementById("saleOnline")?.value);
  }
  else if(pay==="CashCredit"){
    cashAmt=num(document.getElementById("saleCash")?.value);
    creditAmt=Math.max(0,total-cashAmt);
  }
  else if(pay==="OnlineCredit"){
    onlineAmt=num(document.getElementById("saleOnline")?.value);
    creditAmt=Math.max(0,total-onlineAmt);
  }
  else if(pay==="CashOnlineCredit"){
    cashAmt=num(document.getElementById("saleCash")?.value);
    onlineAmt=num(document.getElementById("saleOnline")?.value);
    creditAmt=Math.max(0,total-cashAmt-onlineAmt);
  }
  // Validate split payments
  if(pay==="Both"&&Math.abs(cashAmt+onlineAmt-total)>1){
    bailOut("Cash + Online must equal total ₹"+fmt(total)+"\nCurrently: ₹"+fmt(cashAmt+onlineAmt));return;
  }
  if((pay==="CashCredit"||pay==="OnlineCredit"||pay==="CashOnlineCredit")&&(cashAmt+onlineAmt)<=0){
    bailOut("Enter amount paid now");return;
  }
  if(pay==="CashOnlineCredit"&&(cashAmt+onlineAmt)>total){
    bailOut("Cash + Online cannot exceed total ₹"+fmt(total));return;
  }

  const entry={
    id: editId || uid(),
    customer:cust,
    items,
    size:items[0].size,
    cases:items[0].cases,
    pricePerCase:items[0].pricePerCase,
    payMode:pay,cashAmt,onlineAmt,creditAmt,note,
    // Keep the SAME invoice number when editing — a corrected invoice, not a new one
    invNo: (oldSale&&oldSale.invNo) || ("INV-"+appState.day.date.replace(/-/g,"")+"-"+uid().slice(-4).toUpperCase()),
    total,
    bottles:items.reduce((s,it)=>s+it.bottles,0),
    date:(oldSale&&oldSale.date)||appState.day.date,
    savedAt:(oldSale&&oldSale.savedAt)||new Date().toISOString(),
    savedBy:(oldSale&&oldSale.savedBy)||appState.currentUser?.name||appState.day.incharge||"",
    updatedAt:new Date().toISOString(),
    edited: !!editId,
    editedBy: editId?(appState.currentUser?.name||"Owner"):undefined
  };

  if(editId){
    const idx=appState.day.sales.findIndex(s=>s.id===editId);
    if(idx>=0) appState.day.sales[idx]=entry; else appState.day.sales.push(entry);
    logAudit("EDIT SALE",
      (oldSale?oldSale.customer+" ₹"+fmt(oldSale.total)+" ("+oldSale.payMode+")":"?")+
      "  →  "+cust+" ₹"+fmt(total)+" ("+pay+")");
  }else{
    appState.day.sales.push(entry);
  }

  // Apply every downstream effect: stock, bank, customer outstanding
  _applySaleEffects(entry);

  // Reset form
  window._saleDraft={items:[{size:"200ml",cases:"",price:""}]};

  // Save to Firebase through the single serialized queue (prevents races)
  syncDay();
  render();
  alert((editId?"✅ Sale CORRECTED!\n":"✅ Sale saved! ")+"Customer: "+cust+"\nTotal: ₹"+fmt(total)+
        "\nItems: "+items.map(it=>it.cases+"cs "+it.size).join(", ")+
        (editId?"\n\nStock, cash, bank and outstanding have all been corrected automatically.":""));
};

window.delSale=function(id){
  if(appState.role!=="owner"){alert("Only the owner can delete a sale.");return;}
  const sale=appState.day.sales.find(s=>s.id===id);
  if(!sale){alert("Sale not found");return;}
  const cr=_saleCredit(sale);
  if(!confirm("Delete this sale permanently?\n\n"+sale.customer+" — ₹"+fmt(sale.total)+
    "\n\nThis will automatically:\n• Put "+(sale.items||[]).reduce((s,i)=>s+num(i.cases),0)+" cases back into stock"+
    (num(sale.onlineAmt)>0?"\n• Reduce bank balance by ₹"+fmt(sale.onlineAmt):"")+
    (cr>0?"\n• Reduce "+sale.customer+"'s outstanding by ₹"+fmt(cr):"")+
    "\n• Correct revenue, profit and all reports")) return;

  _reverseSaleEffects(sale);
  appState.day.sales=appState.day.sales.filter(s=>s.id!==id);
  // Tombstone so another phone can never push this sale back
  if(!appState.day.deletedSaleIds) appState.day.deletedSaleIds=[];
  if(!appState.day.deletedSaleIds.includes(id)) appState.day.deletedSaleIds.push(id);
  logAudit("DELETE SALE",sale.customer+" ₹"+fmt(sale.total)+" ("+sale.payMode+")");
  syncDay();render();
  alert("✅ Sale deleted. Stock, cash, bank and outstanding all corrected.");
};

window.addLoanWorker=async function(){
  const name=document.getElementById("lnName")?.value?.trim();
  const phone=document.getElementById("lnPhone")?.value?.trim()||"";
  const opening=num(document.getElementById("lnOpening")?.value);
  if(!name){alert("Enter the worker's name");return;}
  if((window._staffLoans||[]).some(w=>w.name.toLowerCase()===name.toLowerCase())){alert("That worker already exists");return;}
  if(opening>0&&!confirm("Add "+name+" with an OPENING loan of ₹"+fmt(opening)+"?\n\nThis is money already given before the app started.\nIt will show in Outstanding but will NOT reduce today's cash.")) return;
  const id=uid();
  await fbSet("staffLoans",id,{
    name,phone,
    openingLoan:opening,
    balance:opening,
    txns:opening>0?[{id:uid(),type:"opening",amount:opening,date:today(),note:"Opening balance (given before app)"}]:[],
    createdAt:new Date().toISOString()
  });
  logAudit("ADD LOAN WORKER",name+(opening>0?" opening ₹"+fmt(opening):""));
  syncDay();render();
  alert("✅ "+name+" added"+(opening>0?" with opening loan ₹"+fmt(opening):"")+".");
};

window.issueLoan=function(id){
  const w=(window._staffLoans||[]).find(x=>x.id===id);
  if(!w) return;
  const cashNow=dayCashInHand(appState.day);
  const amt=prompt("Give loan to "+w.name+"\nCurrent loan balance: ₹"+fmt(w.balance)+
    "\nCash available now: ₹"+fmt(cashNow)+"\n\nEnter amount to give (from cash):");
  if(!amt||num(amt)<=0) return;
  const a=num(amt);
  if(a>cashNow&&!confirm("⚠️ You only have ₹"+fmt(cashNow)+" cash in hand.\nGiving ₹"+fmt(a)+" will make cash in hand negative.\n\nContinue anyway?")) return;
  const note=prompt("Reason / note (optional):","")||"";
  const txn={id:uid(),type:"issue",amount:a,date:appState.day.date,note};
  fbUpd("staffLoans",id,{balance:num(w.balance)+a,txns:[...(w.txns||[]),txn]});
  if(!appState.day.loans) appState.day.loans=[];
  appState.day.loans.push({id:txn.id,workerId:id,worker:w.name,type:"issue",amount:a,note,date:appState.day.date});
  logAudit("ISSUE LOAN",w.name+" ₹"+fmt(a));
  syncDay();render();
  alert("✅ ₹"+fmt(a)+" given to "+w.name+".\nCash in hand reduced.\nOutstanding now ₹"+fmt(num(w.balance)+a));
};

window.repayLoan=function(id){
  const w=(window._staffLoans||[]).find(x=>x.id===id);
  if(!w) return;
  const amt=prompt("Money returned by "+w.name+"\nOutstanding: ₹"+fmt(w.balance)+"\n\nEnter amount received:");
  if(!amt||num(amt)<=0) return;
  let a=num(amt);
  if(a>num(w.balance)){
    if(!confirm("₹"+fmt(a)+" is more than the ₹"+fmt(w.balance)+" owed.\nRecord only ₹"+fmt(w.balance)+"?")) return;
    a=num(w.balance);
  }
  const note=prompt("Note (optional):","")||"";
  const txn={id:uid(),type:"repay",amount:a,date:appState.day.date,note};
  fbUpd("staffLoans",id,{balance:Math.max(0,num(w.balance)-a),txns:[...(w.txns||[]),txn]});
  if(!appState.day.loans) appState.day.loans=[];
  appState.day.loans.push({id:txn.id,workerId:id,worker:w.name,type:"repay",amount:a,note,date:appState.day.date});
  logAudit("LOAN REPAID",w.name+" ₹"+fmt(a));
  syncDay();render();
  alert("✅ ₹"+fmt(a)+" received from "+w.name+".\nCash in hand increased.\nOutstanding now ₹"+fmt(Math.max(0,num(w.balance)-a)));
};

window.delLoanWorker=async function(id,name){
  const w=(window._staffLoans||[]).find(x=>x.id===id);
  if(!w) return;
  if(num(w.balance)>0&&!confirm("⚠️ "+name+" still owes ₹"+fmt(w.balance)+".\nDeleting removes this from your outstanding permanently.\n\nDelete anyway?")) return;
  if(num(w.balance)<=0&&!confirm("Remove "+name+" from the loans list?")) return;
  await fbDel("staffLoans",id);
  logAudit("DELETE LOAN WORKER",name+" (balance ₹"+fmt(w.balance)+")");
  render();
};

    ${loanOut>0?`<div class="row"><span style="color:#5a8aaa;">🤝 Loans given to workers</span><span style="font-weight:700;color:#ff4d4d;">−₹${fmt(loanOut)}</span></div>`:""}

window.addDep=function(){
  const a=document.getElementById("depAmt")?.value;
  const n=document.getElementById("depNote")?.value||"";
  if(!a){alert("Enter amount");return;}
  if(!appState.day.deposits) appState.day.deposits=[];
  appState.day.deposits.push({id:uid(),amount:a,note:n});
  adjustBankBalance(num(a));
  syncDay();render();
};
window.delDep=function(id){
  if(appState.role!=="owner"){alert("Only owner");return;}
  const dep=(appState.day.deposits||[]).find(x=>x.id===id);
  if(dep) adjustBankBalance(-num(dep.amount));
  appState.day.deposits=(appState.day.deposits||[]).filter(d=>d.id!==id);
  syncDay();render();
};

// ── BANK & FD ──
function buildBankFD(){
  const bd=window._bankData||{bankBalance:0,fds:[]};
  const canEdit=appState.role==="owner"||appState.role==="ophead"||appState.role==="both";
  const fds=(bd.fds||[]).filter(f=>!f.matured);
  const maturedFds=(bd.fds||[]).filter(f=>f.matured);
  const totalFD=fds.reduce((s,f)=>s+num(f.amount),0);
  const maturityVal=f=>{
    const p=num(f.amount),r=num(f.rate),y=num(f.years);
    if(!p||!r||!y) return p;
    return Math.round(p*Math.pow(1+r/100,y));
  };
  const totalMaturity=fds.reduce((s,f)=>s+maturityVal(f),0);
  const bankSet=!!window._bankBalanceSet;
  return `
  <div class="card">
    <div class="lbl">🏦 Bank Balance</div>
    <div style="font-size:28px;font-weight:800;color:#00e5cc;margin:6px 0;">₹${fmt(num(bd.bankBalance))}</div>
    <p style="color:#5a8aaa;font-size:11px;margin:0;">${bankSet?"Auto-updates from sales, expenses, purchases &amp; payments.":"Set your starting balance once below — after that it updates automatically only."}</p>
    ${canEdit&&!bankSet?`<div class="r2" style="margin-top:10px;">
      <div><label class="flbl">Opening Bank Balance (₹)</label><input class="inp" type="number" id="bankBalInp" placeholder="0"/></div>
      <div style="display:flex;align-items:flex-end;"><button class="btn" style="background:#00e5cc;color:#111;" onclick="setBankBalance()">🔒 Set Opening Balance (one-time)</button></div>
    </div>`:""}
  </div>

  ${canEdit?`<div class="card">
    <div class="lbl">➕ Add Fixed Deposit</div>
    <div class="r2">
      <div><label class="flbl">FD Amount (₹)</label><input class="inp" type="number" id="fdAmt" placeholder="0"/></div>
      <div><label class="flbl">Interest Rate (% p.a.)</label><input class="inp" type="number" id="fdRate" placeholder="7.0"/></div>
    </div>
    <div class="r2">
      <div><label class="flbl">Term (years)</label><input class="inp" type="number" id="fdYears" placeholder="1"/></div>
      <div><label class="flbl">Bank / Note</label><input class="inp" type="text" id="fdNote" placeholder="ICICI FD..."/></div>
    </div>
    <div class="r2">
      <div><label class="flbl">Start Date</label><input class="inp" type="date" id="fdStart" value="${today()}"/></div>
      <div><label class="flbl">Maturity Date</label><input class="inp" type="date" id="fdMaturity"/></div>
    </div>
    <button class="btn" style="background:#00e676;color:#111;" onclick="addFD()">+ Add FD</button>
  </div>`:""}

  <div class="card">
    <div class="lbl">📋 Active Fixed Deposits (${fds.length})</div>
    ${fds.length===0?`<div style="color:#5a8aaa;text-align:center;padding:14px;">No active FDs</div>`:
      fds.map(f=>`<div style="border-bottom:1px solid #1a3a55;padding:10px 0;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">₹${fmt(num(f.amount))} <span style="font-size:11px;color:#5a8aaa;">@ ${num(f.rate)}% / ${num(f.years)}yr</span></div>
          ${canEdit?`<button onclick="delFD('${f.id}')" style="background:#ff4d4d22;color:#ff4d4d;border:none;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px;">✕</button>`:""}
        </div>
        <div style="font-size:12px;color:#5a8aaa;">${f.note||""} ${f.start?"• Start "+f.start:""} ${f.maturity?"• Matures "+f.maturity:""}</div>
        <div style="font-size:12px;color:#00e676;">Est. maturity value: ₹${fmt(maturityVal(f))}</div>
        ${canEdit?`<button onclick="matureFD('${f.id}')" style="background:#ffc10722;color:#ffc107;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;">💰 Mark as Matured</button>`:""}
      </div>`).join("")}
    <div class="row" style="margin-top:8px;"><span style="font-weight:800;">Total Invested (active)</span><span style="font-weight:800;color:#00e5cc;">₹${fmt(totalFD)}</span></div>
    <div class="row"><span style="font-weight:800;">Est. Total at Maturity</span><span style="font-weight:800;color:#00e676;">₹${fmt(totalMaturity)}</span></div>
  </div>

  ${maturedFds.length>0?`<div class="card">
    <div class="lbl">✅ Matured FDs (${maturedFds.length})</div>
    ${maturedFds.map(f=>`<div style="border-bottom:1px solid #1a3a55;padding:8px 0;">
      <div style="display:flex;justify-content:space-between;">
        <div style="font-weight:700;">₹${fmt(num(f.amount))} + ₹${fmt(num(f.interestEarned))} interest</div>
        <span style="font-weight:700;color:#00e676;">₹${fmt(num(f.amount)+num(f.interestEarned))}</span>
      </div>
      <div style="font-size:11px;color:#5a8aaa;">${f.note||""} • Matured ${f.maturedOn||""} • credited to bank</div>
    </div>`).join("")}
  </div>`:""}`;
}

async function saveBankData(){
  const bd=window._bankData||{bankBalance:0,fds:[]};
  try{ await fbSet("appSettings","bankData",JSON.parse(JSON.stringify(bd))); }
  catch(e){ console.error("saveBankData error:",e); }
}

// Auto-adjust bank balance by a delta (used by sales/expenses/purchases/payments).
function adjustBankBalance(delta){
  if(!window._bankData) window._bankData={bankBalance:0,fds:[]};
  window._bankData.bankBalance=num(window._bankData.bankBalance)+num(delta);
  saveBankData();
}

// One-time opening balance. After this, manual editing disappears — the
// balance is only ever changed by auto-tracking (or a full trial-data wipe).
window.setBankBalance=async function(){
  if(window._bankBalanceSet){alert("Opening bank balance already set.");return;}
  const v=document.getElementById("bankBalInp")?.value;
  if(v===""||v===undefined||v===null){alert("Enter an amount");return;}
  if(!confirm("This can only be done ONCE. After saving, the bank balance will only change automatically from sales, expenses, purchases, and payments. Continue?")) return;
  if(!window._bankData) window._bankData={bankBalance:0,fds:[]};
  window._bankData.bankBalance=num(v);
  window._bankBalanceSet=true;
  window._stockConfigDoc={...(window._stockConfigDoc||{}),bankBalanceSet:true};
  try{ await fbSet("appSettings","stockConfig",window._stockConfigDoc); }
  catch(e){ console.error("bankBalanceSet flag save error:",e); }
  saveBankData();
  render();
  alert("✅ Opening bank balance set to ₹"+fmt(num(v))+". It will update automatically from here.");
};

window.addFD=function(){
  const amt=document.getElementById("fdAmt")?.value;
  const rate=document.getElementById("fdRate")?.value;
  const years=document.getElementById("fdYears")?.value;
  const note=document.getElementById("fdNote")?.value||"";
  const start=document.getElementById("fdStart")?.value||"";
  const maturity=document.getElementById("fdMaturity")?.value||"";
  if(!amt){alert("Enter FD amount");return;}
  if(!window._bankData) window._bankData={bankBalance:0,fds:[]};
  if(!window._bankData.fds) window._bankData.fds=[];
  window._bankData.fds.push({id:uid(),amount:num(amt),rate:num(rate),years:num(years),note,start,maturity});
  saveBankData();
  alert("✅ FD added: ₹"+fmt(num(amt)));
};

window.delFD=function(id){
  if(!(appState.role==="owner"||appState.role==="ophead")){alert("Only owner/ophead can delete");return;}
  if(!window._bankData||!window._bankData.fds) return;
  window._bankData.fds=window._bankData.fds.filter(f=>f.id!==id);
  saveBankData();
};

// Marks an FD matured: asks for the actual interest earned (not assumed),
// then credits principal + that interest to the bank balance.
window.matureFD=function(id){
  if(!(appState.role==="owner"||appState.role==="ophead")){alert("Only owner/ophead can do this");return;}
  const bd=window._bankData;
  if(!bd||!bd.fds) return;
  const f=bd.fds.find(x=>x.id===id);
  if(!f) return;
  const interestStr=prompt("FD Amount: ₹"+fmt(num(f.amount))+"\n\nEnter the ACTUAL interest earned on maturity (₹):","");
  if(interestStr===null) return; // cancelled
  const interest=num(interestStr);
  if(isNaN(interest)||interest<0){alert("Enter a valid interest amount");return;}
  f.matured=true;
  f.interestEarned=interest;
  f.maturedOn=today();
  adjustBankBalance(num(f.amount)+interest);
  saveBankData();
  render();
  alert("✅ FD matured. ₹"+fmt(num(f.amount)+interest)+" (principal + interest) credited to bank balance.");
};

function buildRpts(){
  const allRpts=getAllReports();

  const fromDate=appState.rptFrom||"";
  const toDate=appState.rptTo||"";
  const selCust=appState.rptCust||"";
  const filtered=allRpts.filter(r=>{
    if(fromDate&&r.date<fromDate)return false;
    if(toDate&&r.date>toDate)return false;
    return true;
  }).sort((a,b)=>a.date.localeCompare(b.date));
  const allCustomers=[...new Set(allRpts.flatMap(r=>(r.sales||[]).map(s=>s.customer)))].sort();
  const allSales=filtered.flatMap(r=>(r.sales||[]).map(s=>({...s,date:r.date})));
  const allExp=filtered.flatMap(r=>(r.expenses||[]).map(e=>({...e,date:r.date})));
  const allPurch=filtered.flatMap(r=>(r.purchases||[]).map(p=>({...p,date:r.date})));
  const allUsage=filtered.flatMap(r=>(r.rmUsage||[]).map(u=>({...u,date:r.date})));
  const allDeps=filtered.flatMap(r=>(r.deposits||[]).map(d=>({...d,date:r.date})));
  const allInc=filtered.flatMap(r=>(r.otherIncome||[]).map(i=>({...i,date:r.date})));
  const allLoans=filtered.flatMap(r=>(r.loans||[]).map(l=>({...l,date:r.date})));
  const totBottle=allSales.reduce((s,x)=>s+num(x.total),0);
  const totOther=allInc.reduce((s,x)=>s+num(x.amount),0);
  const totRev=totBottle+totOther;   // merged, per owner's setting
  const totExp=allExp.reduce((s,x)=>s+num(x.amount),0);
  const totCash=allSales.reduce((s,x)=>s+num(x.cashAmt||0),0)+allInc.filter(x=>x.mode!=="Bank").reduce((s,x)=>s+num(x.amount),0);
  const totOnline=allSales.reduce((s,x)=>s+num(x.onlineAmt||0),0)+allInc.filter(x=>x.mode==="Bank").reduce((s,x)=>s+num(x.amount),0);
  const totCredit=allSales.reduce((s,x)=>s+(num(x.creditAmt)>0?num(x.creditAmt):(x.payMode==="Credit"?num(x.total):0)),0);
  const totDep=allDeps.reduce((s,x)=>s+num(x.amount),0);
  const totCases=allSales.reduce((s,x)=>s+(x.items||[{size:x.size,cases:x.cases}]).reduce((t,it)=>t+num(it.cases),0),0);
  const totLoanOut=allLoans.filter(l=>l.type==="issue").reduce((s,l)=>s+num(l.amount),0);
  const totLoanIn=allLoans.filter(l=>l.type==="repay").reduce((s,l)=>s+num(l.amount),0);
  const staffLoanBal=(window._staffLoans||[]).reduce((s,w)=>s+num(w.balance),0);
  const incMap={};
  allInc.forEach(i=>{incMap[i.source]=(incMap[i.source]||0)+num(i.amount);});
  const matUsedMap={};
  allUsage.forEach(u=>{if(!matUsedMap[u.label])matUsedMap[u.label]={qty:0,unit:u.unit};matUsedMap[u.label].qty+=num(u.qty);});
  const matPurchMap={};
  allPurch.forEach(p=>{if(!matPurchMap[p.label])matPurchMap[p.label]={qty:0,unit:p.unit,total:0};matPurchMap[p.label].qty+=num(p.qty);matPurchMap[p.label].total+=num(p.totalWithGST||p.total||0);});
  const prodMap=Object.fromEntries(SIZES.map(s=>[s,0]));
  filtered.forEach(r=>SIZES.forEach(s=>{prodMap[s]+=num(r.production?.[s]||0);}));
  const custMap={};
  allSales.forEach(s=>{
    if(!custMap[s.customer])custMap[s.customer]={sales:[],total:0,cash:0,online:0,credit:0,cases:0};
    custMap[s.customer].sales.push(s);
    custMap[s.customer].total+=num(s.total);
    custMap[s.customer].cash+=num(s.cashAmt||0);
    custMap[s.customer].online+=num(s.onlineAmt||0);
    custMap[s.customer].credit+=(num(s.creditAmt)>0?num(s.creditAmt):(s.payMode==="Credit"?num(s.total):0));
    (s.items||[{size:s.size,cases:s.cases}]).forEach(it=>{custMap[s.customer].cases+=num(it.cases);});

    </div>
    <div style="font-size:12px;color:#5a8aaa;margin-top:6px;">${filtered.length} days • ${allSales.length} sales</div>
  </div>
  ${view==="range"?`
  ${filtered.length===0?`<div class="card"><div style="color:#5a8aaa;text-align:center;padding:20px;">No data for selected range</div></div>`:`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="lbl" style="margin:0;">📊 Cumulative Summary</div>
      <button onclick="exportRangePDF()" style="background:#003d5c;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;">🖨 PDF</button>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
      ${[["#00e676","₹"+fmt(totRev),"💰 Total Revenue"],["#ff4d4d","₹"+fmt(totExp),"💸 Total Expenses"],[totRev-totExp>=0?"#00e5cc":"#ff4d4d","₹"+fmt(totRev-totExp),"📈 Net Profit"],["#00bfff",fmtN(totCases)+" cases","📦 Cases Sold"],["#00e676","₹"+fmt(totCash),"💵 Cash"],["#00bfff","₹"+fmt(totOnline),"📱 Online"],["#ff4d4d","₹"+fmt(totCredit),"📋 Credit"],["#00e5cc","₹"+fmt(totDep),"🏦 Deposited"],["#00e5cc","₹"+fmt(totOther),"♻️ Other Income"],["#b39ddb","₹"+fmt(staffLoanBal),"🤝 Staff Loans Out"]].map(([c,v,l])=>`

window.setRptRange=function(label){
  const now=new Date(),f=d=>d.toISOString().split("T")[0];
  if(label==="Today"){appState.rptFrom=appState.rptTo=f(now);}
  else if(label==="Last 7 days"){const d=new Date(now);d.setDate(d.getDate()-6);appState.rptFrom=f(d);appState.rptTo=f(now);}
  else if(label==="Last 30 days"){const d=new Date(now);d.setDate(d.getDate()-29);appState.rptFrom=f(d);appState.rptTo=f(now);}
  else if(label==="This Month"){appState.rptFrom=f(now).slice(0,7)+"-01";appState.rptTo=f(now);}
  else if(label==="All time"){appState.rptFrom="";appState.rptTo="";}
  render();
};

window.delRpt=async function(id){if(appState.role!=="owner"){alert("Only owner");return;}if(!confirm("Delete this report?"))return;await fbDel("reports",id);render();};

window.exportCustomerPDF=function(custName){
  const allRpts=getAllReports();
  const fromDate=appState.rptFrom||"";const toDate=appState.rptTo||"";
  const sales=allRpts.filter(r=>(!fromDate||r.date>=fromDate)&&(!toDate||r.date<=toDate)).flatMap(r=>(r.sales||[]).filter(s=>s.customer===custName).map(s=>({...s,date:r.date}))).sort((a,b)=>a.date.localeCompare(b.date));

// ── INVOICE ──
function buildInv(){
  const allReports=getAllReports();
  const allSales=[];
  allReports.forEach(r=>(r.sales||[]).forEach(s=>allSales.push({...s,date:r.date||s.date,shift:r.shift||""})));
  (appState.day.sales||[]).forEach(s=>{if(!allSales.find(x=>x.id===s.id))allSales.push({...s,date:appState.day.date});});
  allSales.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const uniqueDates=[...new Set(allSales.map(s=>s.date))].sort((a,b)=>b.localeCompare(a));
  const selDate=appState.invDate||(uniqueDates[0]||today());
  const textFilter=appState.invFilter||"";
  const byDate=allSales.filter(s=>s.date===selDate);
  const filtered=textFilter?byDate.filter(s=>s.customer?.toLowerCase().includes(textFilter.toLowerCase())||(s.invNo||"").toLowerCase().includes(textFilter.toLowerCase())):byDate;
  return `<div class="card">
    <div class="lbl">🧾 Tax Invoices</div>

    <div style="font-size:12px;color:#5a8aaa;margin-bottom:10px;">${filtered.length} invoice${filtered.length!==1?"s":""} on ${selDate} • ${allSales.length} total</div>

    filtered.length===0?`<div style="color:#5a8aaa;text-align:center;padding:16px;">No invoices for ${selDate}</div>`:
    filtered.map(s=>`<div style="border:1px solid #1a3a55;border-radius:10px;padding:12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="flex:1;">
          <div style="font-weight:700;font-size:14px;color:#fff;">${s.customer}</div>
          <div style="font-size:11px;color:#00bfff;margin-top:2px;">${s.invNo||"—"}</div>
          <div style="font-size:11px;color:#5a8aaa;">${s.date} • ${(s.items||[{size:s.size,cases:s.cases}]).map(it=>`${it.cases}cs ${it.size}`).join("+")} </div>
          <div style="display:flex;gap:6px;margin-top:5px;align-items:center;">
            <span style="font-weight:900;color:#00e676;font-size:14px;">₹${fmt(s.total)}</span>
            <span class="tag" style="background:${s.payMode==="Credit"?"#ff4d4d22":s.payMode==="Cash"?"#00e67622":"#00bfff22"};color:${s.payMode==="Credit"?"#ff4d4d":s.payMode==="Cash"?"#00e676":"#00bfff"};">${s.payMode}</span>

// Mobile-safe print: write content into a hidden iframe and call print on it
function mobilePrint(contentHTML){
  // Remove any existing print iframe
  const old=document.getElementById("_pif");
  if(old) old.remove();
  const iframe=document.createElement("iframe");
  iframe.id="_pif";
  iframe.style.cssText="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;border:none;";
  document.body.appendChild(iframe);
  const doc=iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Paramm Invoice</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      body{font-family:Arial,sans-serif;padding:20px;font-size:12px;color:#111;}
      table{width:100%;border-collapse:collapse;}
      th{background:#003d5c;color:#fff;padding:8px;text-align:left;}
      th:not(:first-child){text-align:right;}
      td{padding:8px;border-bottom:1px solid #eee;}
      td:not(:first-child){text-align:right;}
    </style>
  </head><body>${contentHTML}</body></html>`);
  doc.close();
  iframe.contentWindow.focus();
  setTimeout(function(){
    try{ iframe.contentWindow.print(); }
    catch(e){ window.print(); }
  }, 600);
}

// Quick payment from outstanding page
window.quickPayCust=function(id,name,balance){
  const amt=prompt("Payment received from "+name+"\nOutstanding: ₹"+fmt(balance)+"\n\nEnter amount received:");
  if(!amt||num(amt)<=0) return;
  const method=prompt("Payment method? (Cash/UPI/Bank Transfer):","Cash")||"Cash";
  const c=(window._customers||[]).find(c=>c.id===id);
  if(!c) return;
  const payment={id:uid(),amount:amt,method,date:today(),note:"Quick payment from Outstanding page"};
  fbUpd("customers",id,{balance:Math.max(0,num(c.balance)-num(amt)),payments:[...(c.payments||[]),payment]});
  alert("✅ Payment of ₹"+fmt(amt)+" recorded for "+name);
};

window.quickPayVend=function(id,name,outstanding){
  const amt=prompt("Payment to "+name+"\nOutstanding: ₹"+fmt(outstanding)+"\n\nEnter amount paid:");
  if(!amt||num(amt)<=0) return;
  const method=prompt("Payment method? (Cash/UPI/Bank Transfer):","Bank Transfer")||"Bank Transfer";
  const v=(window._vendors||[]).find(v=>v.id===id);
  if(!v) return;
  const payment={id:uid(),amount:amt,method,date:today(),note:"Quick payment from Outstanding page"};
  fbUpd("vendors",id,{outstanding:Math.max(0,num(v.outstanding)-num(amt)),payments:[...(v.payments||[]),payment]});
  alert("✅ Payment of ₹"+fmt(amt)+" recorded to "+name);
};

window.selectRole=function(role){
  document.getElementById("scRole").value=role;
  ["entry","viewer","both"].forEach(r=>{
    const btn=document.getElementById("role_"+r);
    if(!btn)return;
    const colors={entry:"#00bfff",viewer:"#b39ddb",both:"#00e5cc"};
    const c=colors[r];
    if(r===role){btn.style.background=c+"22";btn.style.color=c;btn.style.borderColor=c;}
    else{btn.style.background="#112233";btn.style.color="#5a8aaa";btn.style.borderColor="#1a3a55";}
  });
};
window.changeOwnerPin=async function(){
  const newPin=document.getElementById("newOwnerPin")?.value?.trim();
  if(!newPin){alert("Enter a new PIN");return;}
  if(newPin.length<4){alert("PIN must be at least 4 digits");return;}
  if(!confirm("Change owner PIN to '"+newPin+"'? Make sure to remember it!")) return;
  window._ownerPin=newPin;
  await window._fs.setDoc(window._fs.doc(window._db,"appSettings","pins"),{ownerPin:newPin,viewerPin:window._viewerPin||""});
  alert("✅ Owner PIN changed successfully!");
  document.getElementById("newOwnerPin").value="";
  render();
};

window.saveOwnerName=async function(){
  const n=document.getElementById("ownerNameInput")?.value?.trim();
  if(!n){alert("Enter your name");return;}
  window._ownerName=n;
  await window._fs.setDoc(window._fs.doc(window._db,"appSettings","ownerInfo"),{name:n});
  appState.currentUser={name:n,role:"owner"};
  alert("✅ Name saved!");
  render();
};

window.setViewerPin=async function(){
  const v=document.getElementById("newVPin")?.value?.trim();
  if(!v){alert("Enter a PIN");return;}
  if(v===window._ownerPin){alert("Cannot be same as owner PIN");return;}
  window._viewerPin=v;
  await fbSet("appSettings","pins",{ownerPin:window._ownerPin,viewerPin:v});
  render();
};
window.removeViewerPin=async function(){
  window._viewerPin="";
  await fbSet("appSettings","pins",{ownerPin:window._ownerPin,viewerPin:""});
  render();
};
window.addCode=async function(){
  const n=document.getElementById("scName")?.value?.trim();
  const c=document.getElementById("scCode")?.value?.trim();
  const r=document.getElementById("scRole")?.value||"entry";
  if(!n||!c){alert("Enter name and code");return;}
  if(c===window._ownerPin||c===window._viewerPin){alert("Code cannot match owner or viewer PIN");return;}
  if((window._staffCodes||[]).find(sc=>sc.code===c)){alert("Code already exists");return;}
  const id=uid();
  await fbSet("staffCodes",id,{id,name:n,code:c,role:r,active:true});
  render();
};
window.toggleCode=async function(id,active){await fbUpd("staffCodes",id,{active:!active});};

function buildPhotoProof(){
  const allReports=getAllReports();
  const allSales=[];
  allReports.forEach(r=>(r.sales||[]).forEach(s=>{if(s.photo)allSales.push({...s,date:r.date||s.date});}));
  (appState.day.sales||[]).forEach(s=>{if(s.photo&&!allSales.find(x=>x.id===s.id))allSales.push({...s,date:appState.day.date});});
  allSales.sort((a,b)=>b.date.localeCompare(a.date));
  const uniqueDates=[...new Set(allSales.map(s=>s.date))].sort((a,b)=>b.localeCompare(a));
  const selDate=appState.proofDate||"";
  const filtered=selDate?allSales.filter(s=>s.date===selDate):allSales;
  const noPhoto=[];
  getAllReports().forEach(r=>(r.sales||[]).filter(s=>!s.photo).forEach(s=>noPhoto.push({...s,date:r.date})));
  (appState.day.sales||[]).filter(s=>!s.photo).forEach(s=>noPhoto.push({...s,date:appState.day.date}));
  return `<div class="card">
    <div class="lbl">📷 Sale Photo Proof</div>
